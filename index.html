<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FRESHMAN MEDIA GROUP</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      padding: 1.5rem;
      text-align: center;
      background: #0f0f1a;
      overflow: hidden;
      position: relative;
    }

    /* Анимированный фон */
    .bg-animation {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      background: 
        radial-gradient(ellipse at 80% 0%, rgba(234, 179, 8, 0.25) 0%, transparent 50%),
        radial-gradient(ellipse at 100% 20%, rgba(150, 200, 255, 0.15) 0%, transparent 40%),
        radial-gradient(ellipse at 60% 100%, rgba(234, 179, 8, 0.08) 0%, transparent 40%),
        linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
      animation: pulse 8s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      0% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.85;
        transform: scale(1.05);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Лучи */
    .rays {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .ray {
      position: absolute;
      top: -10%;
      right: -10%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        135deg,
        transparent 0%,
        rgba(234, 179, 8, 0.04) 20%,
        rgba(234, 179, 8, 0.07) 25%,
        transparent 30%,
        transparent 45%,
        rgba(150, 200, 255, 0.04) 50%,
        rgba(150, 200, 255, 0.07) 55%,
        transparent 60%
      );
      transform-origin: top right;
      animation: rayMove 12s linear infinite;
    }

    .ray:nth-child(2) {
      transform: rotate(15deg) scale(0.8);
      animation-duration: 15s;
      animation-delay: -3s;
      opacity: 0.6;
    }

    .ray:nth-child(3) {
      transform: rotate(-10deg) scale(1.2);
      animation-duration: 18s;
      animation-delay: -6s;
      opacity: 0.4;
    }

    .ray:nth-child(4) {
      transform: rotate(25deg) scale(0.9);
      animation-duration: 14s;
      animation-delay: -2s;
      opacity: 0.5;
    }

    @keyframes rayMove {
      0% {
        transform: rotate(0deg) scale(1);
        opacity: 0.2;
      }
      25% {
        opacity: 0.7;
      }
      50% {
        transform: rotate(5deg) scale(1.1);
        opacity: 0.4;
      }
      75% {
        opacity: 0.8;
      }
      100% {
        transform: rotate(0deg) scale(1);
        opacity: 0.2;
      }
    }

    /* Звёзды */
    .stars {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .star {
      position: absolute;
      border-radius: 50%;
      background: white;
      animation: twinkle 3s ease-in-out infinite alternate;
    }

    @keyframes twinkle {
      0% {
        opacity: 0.2;
        transform: scale(0.8);
      }
      100% {
        opacity: 1;
        transform: scale(1.2);
      }
    }

    /* Затемнение */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 15, 26, 0.4);
      z-index: 1;
      pointer-events: none;
    }

    /* Контейнер с контентом */
    .content {
      position: relative;
      z-index: 2;
      max-width: 900px;
      padding: 2rem;
    }

    /* Анимированный текст - в одну строку */
    .animated-text {
      display: flex;
      flex-wrap: nowrap;
      justify-content: center;
      gap: 0.3rem;
      margin-bottom: 1rem;
    }

    .word {
      display: inline-block;
      font-size: clamp(2.5rem, 8vw, 5.5rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #ffffff;
      text-shadow: 0 0 40px rgba(234, 179, 8, 0.15);
      opacity: 0;
      filter: blur(10px);
      transform: translateY(-50px);
      animation: blurReveal 0.35s ease forwards;
      animation-delay: var(--delay);
      white-space: nowrap;
    }

    .word:nth-child(1) { --delay: 0s; }
    .word:nth-child(2) { --delay: 0.15s; }
    .word:nth-child(3) { --delay: 0.30s; }

    @keyframes blurReveal {
      0% {
        opacity: 0;
        filter: blur(10px);
        transform: translateY(-50px);
      }
      40% {
        opacity: 0.5;
        filter: blur(5px);
        transform: translateY(-5px);
      }
      100% {
        opacity: 1;
        filter: blur(0px);
        transform: translateY(0);
      }
    }

    /* Основной текст */
    .main-text {
      font-size: clamp(1rem, 1.8vw, 1.3rem);
      line-height: 1.8;
      color: rgba(255, 255, 255, 0.7);
      margin-top: 1.5rem;
      opacity: 0;
      animation: fadeInUp 0.8s ease forwards;
      animation-delay: 0.8s;
    }

    .main-text .highlight {
      color: #eab308;
      font-weight: 600;
      background: rgba(234, 179, 8, 0.1);
      padding: 0.1rem 0.5rem;
      border-radius: 6px;
      border: 1px solid rgba(234, 179, 8, 0.15);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Разделитель */
    .divider {
      width: 100px;
      height: 2px;
      margin: 1.5rem auto 0;
      background: linear-gradient(90deg, transparent, rgba(234, 179, 8, 0.3), transparent);
      opacity: 0;
      animation: fadeIn 1s ease forwards;
      animation-delay: 1s;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    /* Адаптивность */
    @media (max-width: 768px) {
      .animated-text {
        gap: 0.15rem;
      }
      .word {
        font-size: clamp(2rem, 7vw, 3.5rem);
      }
      .main-text {
        font-size: 0.95rem;
        padding: 0 0.5rem;
      }
    }

    @media (max-width: 480px) {
      .animated-text {
        gap: 0.1rem;
      }
      .word {
        font-size: clamp(1.5rem, 5vw, 2.5rem);
      }
      .main-text {
        font-size: 0.85rem;
        line-height: 1.6;
      }
    }
  </style>
</head>
<body>
  <!-- Фон -->
  <div class="bg-animation"></div>
  
  <!-- Лучи -->
  <div class="rays">
    <div class="ray"></div>
    <div class="ray"></div>
    <div class="ray"></div>
    <div class="ray"></div>
  </div>

  <!-- Звёзды -->
  <div class="stars" id="stars"></div>

  <!-- Затемнение -->
  <div class="overlay"></div>

  <!-- Контент -->
  <div class="content">
    <!-- Анимированный текст в одну строку -->
    <div class="animated-text">
      <span class="word">FRESHMAN</span>
      <span class="word">MEDIA</span>
      <span class="word">GROUP</span>
    </div>

    <div class="divider"></div>

    <!-- Информация об обновлении -->
    <div class="main-text">
      Сайт находится на этапе <span class="highlight">глобального обновления</span>.<br>
      В скором времени будет анонс новой версии.
    </div>
  </div>

  <script>
    // Генерируем звёзды
    const starsContainer = document.getElementById('stars');
    for (let i = 0; i < 50; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 100 + '%';
      const size = Math.random() * 2 + 1;
      star.style.width = size + 'px';
      star.style.height = size + 'px';
      star.style.animationDelay = Math.random() * 5 + 's';
      star.style.animationDuration = (Math.random() * 3 + 2) + 's';
      star.style.opacity = Math.random() * 0.5 + 0.2;
      starsContainer.appendChild(star);
    }
  </script>
</body>
</html>
